version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "01:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gomod"
    directory: "/services/download-node"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "01:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/services/download-node"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "01:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "01:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore"
      include: "scope"
