name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build Worker and assets (B2)
        env:
          D1_DATABASE_NAME: ci-d1
          D1_DATABASE_ID: 00000000-0000-4000-8000-000000000001
        run: bun run build
